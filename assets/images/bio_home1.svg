<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <linearGradient id="bg" x1="0" x2="1">
      <stop offset="0" stop-color="#7b61ff"/>
      <stop offset="1" stop-color="#4ec5e1"/>
    </linearGradient>
    <linearGradient id="dna" x1="0" x2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.8"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>
  <g transform="translate(120,60) scale(0.8)" stroke="url(#dna)" stroke-width="18" fill="none" stroke-linecap="round">
    <!-- curved backbone -->
    <path d="M80 40 C 200 120, 120 280, 240 360 C 360 440, 300 560, 420 640 C 540 720, 480 860, 600 940" stroke-opacity="0.85"/>
    <path d="M160 40 C 80 140, 240 260, 160 360 C 80 460, 320 560, 240 660 C 160 760, 400 860, 320 960" stroke-opacity="0.85"/>
    <!-- rungs -->
    <g stroke-width="8" stroke-linecap="round">
      <line x1="120" y1="90" x2="220" y2="110" stroke-opacity="0.95"/>
      <line x1="160" y1="190" x2="260" y2="210" stroke-opacity="0.95"/>
      <line x1="100" y1="290" x2="200" y2="310" stroke-opacity="0.95"/>
      <line x1="180" y1="390" x2="280" y2="410" stroke-opacity="0.95"/>
      <line x1="140" y1="490" x2="240" y2="510" stroke-opacity="0.95"/>
      <line x1="220" y1="590" x2="320" y2="610" stroke-opacity="0.95"/>
      <line x1="160" y1="690" x2="260" y2="710" stroke-opacity="0.95"/>
    </g>
  </g>
  <text x="60" y="720" fill="rgba(255,255,255,0.85)" font-family="Segoe UI, Tahoma, Arial" font-size="28" font-weight="600">Stackly — Advanced Biotechnology</text>
</svg>